name: sView
options:
  bundleIdPrefix: io.github.usuite
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  sView:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  sView:
    type: application
    platform: macOS
    sources:
      - path: Sources/sView
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: scripts/sview
        buildPhase: resources
    dependencies:
      - package: sView
        product: SViewCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.usuite.sview
        PRODUCT_NAME: sView
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  sView:
    build:
      targets:
        sView: all
